name: Build OLLVM Toolchain (wasm opt, LLVM 20)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish the built opt binary under (e.g. toolchain-wasm-v1)'
        required: true

# Separate from build-toolchain.yml: that workflow builds the native (clang+lld+opt)
# toolchain against an LLVM 22 base, for swan's native-platform obfuscated builds.
# swan's WASM obfuscation path (swan/cmake/swan_obf_wasm_compiler_wrapper.py) only
# ever needs `opt` (compilation itself still goes through Emscripten's own em++),
# and it must be built against the exact LLVM version Emscripten 3.1.71 bundles
# (LLVM 20 -- see wasm/obfuscator-llvm20/README.md for why version skew here is
# not just "won't build" but can silently produce an ABI-broken .wasm). Building
# only `opt`, with no LLVM_ENABLE_PROJECTS at all (clang/lld are separate
# top-level projects `opt` doesn't need), keeps this job far cheaper than the
# native one.
jobs:
  linux_amd64:
    name: Build opt (linux_amd64, LLVM 20)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af || true
          df -h

      - name: Restore ccache dir
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ollvm-wasm-ccache-linux_amd64-${{ hashFiles('wasm/obfuscator-llvm20/LLVM_COMMIT', 'wasm/obfuscator-llvm20/integration.patch') }}
          restore-keys: ollvm-wasm-ccache-linux_amd64-

      - name: Build inside manylinux_2_28_x86_64
        run: |
          LLVM_REF=$(cat wasm/obfuscator-llvm20/LLVM_COMMIT)
          mkdir -p out
          mkdir -p "${{ github.workspace }}/.ccache"
          docker run --rm -v "${{ github.workspace }}":/work -w /work -e CCACHE_DIR=/work/.ccache quay.io/pypa/manylinux_2_28_x86_64 bash -lc "
            set -euxo pipefail
            yum groupinstall -y 'Development Tools'
            yum install -y curl zip unzip tar autoconf libtool ccache python3 zstd wget jq git clang

            # See build-toolchain.yml's linux_amd64 job for why a prebuilt
            # ninja binary instead of yum/pip -- same manylinux_2_28 image,
            # same ninja depslog + ancient-pip issues apply here.
            curl -sL -o /tmp/ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip
            unzip -o /tmp/ninja.zip -d /usr/local/bin
            chmod +x /usr/local/bin/ninja
            ninja --version

            gcc --version
            g++ --version

            git init llvm-src
            cd llvm-src
            git remote add origin https://github.com/llvm/llvm-project.git
            git fetch --depth 1 origin '$LLVM_REF'
            git checkout FETCH_HEAD

            # Graft the vendored obfuscator module onto this LLVM 20 base --
            # same source drop wasm_obf_wasm_compiler_wrapper.py's opt is built
            # from locally, see /work/wasm/obfuscator-llvm20/README.md for what
            # this is and why only 4 of 90 files needed real API adaptations.
            cp /work/wasm/obfuscator-llvm20/src/include/llvm/Transforms/Obfuscator.h llvm/include/llvm/Transforms/Obfuscator.h
            cp -R /work/wasm/obfuscator-llvm20/src/include/llvm/Transforms/Obfuscator llvm/include/llvm/Transforms/Obfuscator
            cp -R /work/wasm/obfuscator-llvm20/src/lib/Transforms/Obfuscator llvm/lib/Transforms/Obfuscator
            git apply /work/wasm/obfuscator-llvm20/integration.patch

            # No LLVM_ENABLE_PROJECTS: opt is a core LLVM tool, not part of the
            # clang/lld projects -- the wasm path never needs those (compilation
            # goes through Emscripten's own em++, never this toolchain's clang).
            cmake -S llvm -B build -G Ninja \
              -DLLVM_ENABLE_RTTI=ON \
              -DLLVM_ENABLE_EH=ON \
              -DLLVM_TARGETS_TO_BUILD='X86;AArch64' \
              -DLLVM_INCLUDE_TESTS=OFF -DLLVM_BUILD_TESTS=OFF \
              -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF \
              -DLLVM_ENABLE_ASSERTIONS=OFF \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DLLVM_PARALLEL_LINK_JOBS=1
            cmake --build build --parallel --target opt
            ccache -s

            ./build/bin/opt --version | tee /tmp/opt_version.txt
            grep -q 'LLVM version 20\.' /tmp/opt_version.txt \
              && echo 'OK: built opt reports LLVM 20' \
              || (echo 'FAIL: built opt does not report LLVM 20' && exit 1)

            mkdir -p /work/out/ollvm-opt-wasm-linux_amd64
            cp build/bin/opt /work/out/ollvm-opt-wasm-linux_amd64/opt
            cp /work/wasm/obfuscator-llvm20/README.md /work/out/ollvm-opt-wasm-linux_amd64/README.md
            cp /work/wasm/obfuscator-llvm20/LLVM_COMMIT /work/out/ollvm-opt-wasm-linux_amd64/LLVM_COMMIT
            cp /work/wasm/obfuscator-llvm20/OLLVM_SOURCE_COMMIT /work/out/ollvm-opt-wasm-linux_amd64/OLLVM_SOURCE_COMMIT
            cd /work/out/ollvm-opt-wasm-linux_amd64 && tar -I zstd -cf /work/out/ollvm-opt-wasm-linux_amd64.tar.zst .
          "

      - name: Save ccache dir
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ollvm-wasm-ccache-linux_amd64-${{ hashFiles('wasm/obfuscator-llvm20/LLVM_COMMIT', 'wasm/obfuscator-llvm20/integration.patch') }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ollvm-opt-wasm-linux_amd64
          path: out/ollvm-opt-wasm-linux_amd64.tar.zst
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [linux_amd64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: artifacts/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: artifacts/*
          draft: false
